<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartz Tools - Instrumentos Musicales</title>

    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header>
        <nav class="navbar">
            
            <button class="menu-btn" id="btn-menu">
                <i class="fas fa-bars"></i>
            </button>

            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">HEARTZ TOOLS</a>
            
            <div class="nav-actions">
                <a href="carrito.html" class="cart-btn"><i class="fas fa-shopping-cart"></i></a>
            </div>

            <ul class="nav-links" id="enlaces-menu">
                <li><a href="index.html">INICIO</a></li>
                <li><a href="catalogo.html">CATÁLOGO</a></li> 
                <li><a href="nosotros.html">NOSOTROS</a></li>
                <li><a href="contacto.html">CONTACTO</a></li>
                <li><a href="login.html">INICIAR SESIÓN</a></li>
            </ul>
        </nav>
    </header>

    <main>
        
        <section class="hero" style="position: relative; overflow: hidden; z-index: 1;">
            
            <img id="img-carrusel" src="assets/img/audifonos.jpg" alt="Fondo Carrusel" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
            
            <button class="carousel-btn left" id="btn-izq"><i class="fas fa-chevron-left"></i></button>
            
            <div class="hero-content">
                <h2>¡VISITA NUESTRO CATALOGO!</h2>
            </div>

            <button class="carousel-btn right" id="btn-der"><i class="fas fa-chevron-right"></i></button>
        </section>

        <section class="destacados">
            <h3>PRODUCTOS DESTACADOS</h3>
            <div class="arrow-down">↓</div>
            
            <div class="grid-productos">
                
                <article class="producto-card">
                    <a href="detalle-guitarra.html" style="text-decoration: none; color: inherit; display: block; text-align: center;">
                        <img src="assets/img/guitarra-negro.jpg" alt="Guitarras">
                        <h4 style="margin-top: 15px; font-size: 1.2rem;">Guitarras</h4>
                    </a>
                </article>
                
                <article class="producto-card">
                    <a href="detalle-bateria.html" style="text-decoration: none; color: inherit; display: block; text-align: center;">
                        <img src="assets/img/bateria-azul.jpg" alt="Baterías">
                        <h4 style="margin-top: 15px; font-size: 1.2rem;">Baterías</h4>
                    </a>
                </article>
                
                <article class="producto-card">
                    <a href="detalle-auriculares.html" style="text-decoration: none; color: inherit; display: block; text-align: center;">
                        <img src="assets/img/auriculares-negro.jpg" alt="Audífonos">
                        <h4 style="margin-top: 15px; font-size: 1.2rem;">Audífonos</h4>
                    </a>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Heartz Tools. Todos los derechos reservados.</p>
    </footer>

    <script>
        const imagenes = [
            'assets/img/audifonos.jpg', 
            'assets/img/Guitarra.jpg', 
            'assets/img/microfono.jfif'
        ];
        let indiceActual = 0;
        
        const imgCarrusel = document.getElementById('img-carrusel');

        function cambiarImagen(direccion) {
            indiceActual += direccion;
            
            if (indiceActual >= imagenes.length) {
                indiceActual = 0;
            } else if (indiceActual < 0) {
                indiceActual = imagenes.length - 1;
            }
            
            imgCarrusel.src = imagenes[indiceActual];
        }

        document.getElementById('btn-izq').addEventListener('click', () => {
            cambiarImagen(-1);
            reiniciarTemporizador();
        });

        document.getElementById('btn-der').addEventListener('click', () => {
            cambiarImagen(1);
            reiniciarTemporizador();
        });

        let temporizador = setInterval(() => cambiarImagen(1), 2000);

        function reiniciarTemporizador() {
            clearInterval(temporizador);
            temporizador = setInterval(() => cambiarImagen(1), 2000);
        }
    </script>

    <script>
        const btnMenu = document.getElementById('btn-menu');
        const enlacesMenu = document.getElementById('enlaces-menu');

        btnMenu.addEventListener('click', () => {
            
            enlacesMenu.classList.toggle('mostrar');
        });
    </script>

</body>
</html>
