<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Heartz Tools</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<header>
        <nav class="navbar">
            <!-- Botón Hamburguesa a la izquierda -->
            <button class="menu-btn" id="btn-menu">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Logo centrado que redirige al inicio -->
            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">HEARTZ TOOLS PANEL DE ADMINISTRACION</a>
            
            <!-- Carrito a la derecha (con el contador preparado) -->
            <div class="nav-actions">
                <a href="carrito.html" class="cart-btn" style="position: relative;">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="contador-carrito" style="position: absolute; top: -5px; right: -8px; background-color: #ff3b30; color: white; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 50%; display: none;">0</span>
                </a>
            </div>

            <!-- Enlaces abajo (ocultos por defecto) -->
            <ul class="nav-links" id="enlaces-menu">
                <li><a href="index.html">INICIO</a></li>
                <li><a href="catalogo.html">CATÁLOGO</a></li> 
                <li><a href="nosotros.html">NOSOTROS</a></li>
                <li><a href="contacto.html">CONTACTO</a></li>
                <li><a href="login.html">INICIAR SESIÓN</a></li>
            </ul>
        </nav>
    </header>
    <main class="contenedor-admin">
        <h2>Panel de Gestión de Productos</h2>
        <div class="admin-grid-layout">
            <div class="caja-auth admin-form-box">
                <h3>Agregar Nuevo Producto</h3>
                <form id="form-crear-producto">
                    <div class="grupo-opcion">
                        <label for="admin-titulo">Nombre del Producto:</label>
                        <input type="text" id="admin-titulo" required>
                    </div>
                    <div class="grupo-opcion">
                        <label for="admin-precio">Precio (ej: $150.000):</label>
                        <input type="text" id="admin-precio" required>
                    </div>
                    <div class="grupo-opcion">
                        <label for="admin-imagen">Nombre de la Imagen (ej: bajo-negro.jpg):</label>
                        <input type="text" id="admin-imagen" required>
                    </div>
                    <button type="submit" class="btn-agregar-grande">Publicar en Catálogo</button>
                </form>
            </div>
            <div class="admin-tabla-box">
                <h3>Productos Actuales</h3>
                <div class="tabla-carrito-contenedor">
                    <table class="tabla-carrito">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="admin-lista-productos">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Heartz Tools. Panel de Administración.</p>
    </footer>

    <script src="assets/js/validaciones.js"></script>

    <!-- Script del Menú Hamburguesa -->
    <script>
        const btnMenu = document.getElementById('btn-menu');
        const enlacesMenu = document.getElementById('enlaces-menu');

        btnMenu.addEventListener('click', () => {
            enlacesMenu.classList.toggle('mostrar');
        });
    </script>
</body>
</html>


</body>
</html>
